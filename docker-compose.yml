services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       prime
      POSTGRES_USER:     prime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prime_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # expose for local psql / pgAdmin if needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prime -d prime"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://prime:${POSTGRES_PASSWORD:-prime_dev}@db:5432/prime
    volumes:
      - ./backend:/app/backend
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  prime:
    build: .
    ports:
      - "7474:7474"
    environment:
      # Optional — only needed to run agents.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://prime:${POSTGRES_PASSWORD:-prime_dev}@db:5432/prime
    volumes:
      # Mount source so code and frontend changes are live without rebuilding
      - ./backend:/app/backend
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./prime-os.html:/app/prime-os.html
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7474/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Run tests: docker-compose run --rm test
  test:
    build: .
    command: pytest -v --tb=short
    environment:
      DATABASE_URL: postgresql+asyncpg://prime:prime_dev@db:5432/prime_test
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
    depends_on:
      db:
        condition: service_healthy

  # Manual seed: docker-compose run seed
  seed:
    build: .
    command: python -m backend.seed
    environment:
      DATABASE_URL: postgresql+asyncpg://prime:${POSTGRES_PASSWORD:-prime_dev}@db:5432/prime
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
