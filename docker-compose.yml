services:
  prime:
    build: .
    ports:
      - "7474:7474"
    environment:
      # Optional — only needed to run agents. Projects, graph, and resources work without it.
      # Set in .env or inline: ANTHROPIC_API_KEY=sk-ant-... docker compose up
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PRIME_WORKSPACE: /data
    volumes:
      # Persists all PRIME data (projects, knowledge, runs) on the host
      - ${PRIME_DATA_DIR:-~/PRIME}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7474/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Auto-seeds on first boot if /data is empty — no manual step needed.

  # Manual seed: docker compose run seed
  seed:
    build: .
    command: python -m backend.seed
    environment:
      PRIME_WORKSPACE: /data
    volumes:
      - ${PRIME_DATA_DIR:-~/PRIME}:/data
